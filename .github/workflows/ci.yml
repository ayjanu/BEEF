name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Lint and Test Shared Types
  shared-types:
    name: Shared Types - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: shared/types/package-lock.json

      - name: Install dependencies
        working-directory: shared/types
        run: npm ci

      - name: Build
        working-directory: shared/types
        run: npm run build

  # Matchmaking Service (Go)
  matchmaking:
    name: Matchmaking Service - Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: services/matchmaking/go.sum

      - name: Install dependencies
        working-directory: services/matchmaking
        run: go mod download

      - name: Run tests
        working-directory: services/matchmaking
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        working-directory: services/matchmaking
        run: go build -v -o bin/matchmaking ./cmd/server

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/matchmaking/coverage.out
          flags: matchmaking

  # Game Engine Service (Node.js)
  game-engine:
    name: Game Engine Service - Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/game-engine/package-lock.json

      - name: Install dependencies
        working-directory: services/game-engine
        run: npm ci

      - name: Lint
        working-directory: services/game-engine
        run: npm run lint

      - name: Run tests
        working-directory: services/game-engine
        run: npm test

      - name: Build
        working-directory: services/game-engine
        run: npm run build

  # Infrastructure CDK
  infrastructure:
    name: Infrastructure - Synth & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/cdk/package-lock.json

      - name: Install dependencies
        working-directory: infrastructure/cdk
        run: npm ci

      - name: Build
        working-directory: infrastructure/cdk
        run: npm run build

      - name: Synth CDK
        working-directory: infrastructure/cdk
        run: npm run synth

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [matchmaking, game-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: beefmobile/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
