name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [matchmaking, game-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR Repository URI
        id: ecr-uri
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name BeefmobileStack-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?ExportName=='${{ matrix.service == 'matchmaking' && 'MatchmakingECRRepo' || 'GameEngineECRRepo' }}-${{ env.ENVIRONMENT }}'].OutputValue" \
            --output text)
          echo "uri=$REPO_URI" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr-uri.outputs.uri }}:latest
            ${{ steps.ecr-uri.outputs.uri }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/cdk/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infrastructure/cdk
        run: npm ci

      - name: Deploy CDK Stack
        working-directory: infrastructure/cdk
        run: npm run deploy:dev -- --require-approval never

  update-services:
    name: Update ECS Services
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [matchmaking, game-engine]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster beefmobile-cluster-${{ env.ENVIRONMENT }} \
            --service ${{ matrix.service }}-${{ env.ENVIRONMENT }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster beefmobile-cluster-${{ env.ENVIRONMENT }} \
            --services ${{ matrix.service }}-${{ env.ENVIRONMENT }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: update-services
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Load Balancer URL
        id: alb-url
        run: |
          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name BeefmobileStack-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?ExportName=='LoadBalancerDNS-${{ env.ENVIRONMENT }}'].OutputValue" \
            --output text)
          echo "url=http://$ALB_URL" >> $GITHUB_OUTPUT

      - name: Health Check - Matchmaking
        run: |
          curl -f ${{ steps.alb-url.outputs.url }}/health || exit 1

      - name: Health Check - Game Engine
        run: |
          curl -f ${{ steps.alb-url.outputs.url }}/health || exit 1

      - name: Deployment Success
        run: echo "✅ Deployment to ${{ env.ENVIRONMENT }} successful!"
