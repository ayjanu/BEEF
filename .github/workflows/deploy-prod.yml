name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: prod

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [matchmaking, game-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR Repository URI
        id: ecr-uri
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name BeefmobileStack-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?ExportName=='${{ matrix.service == 'matchmaking' && 'MatchmakingECRRepo' || 'GameEngineECRRepo' }}-${{ env.ENVIRONMENT }}'].OutputValue" \
            --output text)
          echo "uri=$REPO_URI" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr-uri.outputs.uri }}:latest
            ${{ steps.ecr-uri.outputs.uri }}:${{ steps.version.outputs.tag }}
            ${{ steps.ecr-uri.outputs.uri }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/cdk/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infrastructure/cdk
        run: npm ci

      - name: Deploy CDK Stack
        working-directory: infrastructure/cdk
        run: npm run deploy:prod -- --require-approval never

      - name: Get Load Balancer URL
        id: get-url
        run: |
          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name BeefmobileStack-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?ExportName=='LoadBalancerDNS-${{ env.ENVIRONMENT }}'].OutputValue" \
            --output text)
          echo "url=http://$ALB_URL" >> $GITHUB_OUTPUT

  rolling-update:
    name: Rolling Update ECS Services
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: 1  # Update one service at a time
      matrix:
        service: [matchmaking, game-engine]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster beefmobile-cluster-${{ env.ENVIRONMENT }} \
            --service ${{ matrix.service }}-${{ env.ENVIRONMENT }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster beefmobile-cluster-${{ env.ENVIRONMENT }} \
            --services ${{ matrix.service }}-${{ env.ENVIRONMENT }}

      - name: Service updated
        run: echo "✅ ${{ matrix.service }} updated successfully"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: rolling-update
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Load Balancer URL
        id: alb-url
        run: |
          ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name BeefmobileStack-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?ExportName=='LoadBalancerDNS-${{ env.ENVIRONMENT }}'].OutputValue" \
            --output text)
          echo "url=http://$ALB_URL" >> $GITHUB_OUTPUT

      - name: Health Check - Matchmaking
        run: |
          for i in {1..5}; do
            curl -f ${{ steps.alb-url.outputs.url }}/health && break
            sleep 10
          done

      - name: Health Check - Game Engine
        run: |
          for i in {1..5}; do
            curl -f ${{ steps.alb-url.outputs.url }}/health && break
            sleep 10
          done

      - name: Deployment Success
        run: |
          echo "🎉 Production deployment successful!"
          echo "URL: ${{ steps.alb-url.outputs.url }}"
