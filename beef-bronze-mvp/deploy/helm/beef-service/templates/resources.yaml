apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "beef.name" . }}
  labels: {{- include "beef.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beef.name" . }}
  labels: {{- include "beef.labels" . | nindent 4 }}
spec:
  selector: {{- include "beef.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "beef.name" . }}
  labels: {{- include "beef.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "beef.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- with .Values.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "beef.name" $ }}
  labels: {{- include "beef.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels: {{- include "beef.selector" $ | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
# Every service joins one shared ALB (group "beef", set on the IngressClassParams).
# Only public paths are listed; /internal/* routes are never exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "beef.name" . }}
  labels: {{- include "beef.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.probes.readiness }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "beef.name" $ }}
                port: { name: http }
          {{- end }}
{{- end }}
